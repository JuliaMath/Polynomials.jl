name: IntegrationTest
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.package.repo }}/${{ matrix.package.group }}/${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GROUP: ${{ matrix.package.group }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: [1]
        os: [ubuntu-latest]
        package:
          - {user: JuliaDSP,     repo: DSP.jl, group: All}
          - {user: tkluck,       repo: GaloisFields.jl, group: All}
          - {user: jverzani,     repo: SpecialPolynomials.jl, group: All}
          - {user: JuliaGNI,     repo: QuadratureRules.jl, group: All}
          # Disabled; each also fails against master, for reasons outside this package:
          # - {user: JuliaControl, repo: ControlSystems.jl, group: All}    # ~36 min; its Aqua checks fail after `Pkg.develop` edits its Project.toml
          # - {user: JuliaGNI,     repo: RungeKutta.jl, group: All}        # its Aqua check fails: no compat entry after `Pkg.develop`
          # - {user: andreasvarga, repo: MatrixPencils.jl, group: All}     # GenericSchur convergence failure with BigFloat
          # - {user: andreasvarga, repo: DescriptorSystems.jl, group: All} # l2norm tests return Inf
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/julia-buildpkg@latest
      - name: Clone Downstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream
      - name: Load this and run the downstream tests
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          try
            # force it to use this PR's version of the package
            Pkg.develop(PackageSpec(path="."))  # resolver may fail with main deps
            Pkg.update()
            Pkg.build() # some packages need their deps/build.jl run (e.g. GaloisFields)
            Pkg.test()  # resolver may fail with test time deps
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            # If we can't resolve that means this is incompatible by SemVer and this is fine
            # It means we marked this as a breaking change, so we don't need to worry about
            # Mistakenly introducing a breaking change, as we have intentionally made one
            @info "Not compatible with this release. No problem." exception=err
            exit(0)  # Exit immediately, as a success
          end